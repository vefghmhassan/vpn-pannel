<div class="bg-base-100 rounded-box shadow p-3 mb-4 flex items-center justify-between">
  <h1 class="text-2xl font-bold">تنظیمات برنامه</h1>
</div>

<form method="post" action="/admin/settings" class="space-y-6" id="settings-form">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <label class="form-control cursor-pointer">
      <div class="label">
        <span class="label-text">انتخاب همه</span>
      </div>
      <input id="toggleAllSettings" type="checkbox" class="toggle toggle-secondary" />
    </label>

    <label class="form-control cursor-pointer">
      <div class="label">
        <span class="label-text">فعال بودن تبلیغات در Splash</span>
      </div>
      <input type="checkbox" name="ads_enabled_in_splash" class="toggle toggle-primary js-setting-toggle" {{ if .s.AdsEnabledInSplash }}checked{{ end }} />
    </label>

    <label class="form-control cursor-pointer">
      <div class="label">
        <span class="label-text">نمایش تبلیغ بعد از Splash</span>
      </div>
      <input type="checkbox" name="show_ads_after_splash" class="toggle toggle-primary js-setting-toggle" {{ if .s.ShowAdsAfterSplash }}checked{{ end }} />
    </label>

    <label class="form-control cursor-pointer">
      <div class="label">
        <span class="label-text">فعال بودن تبلیغ ریوارد</span>
      </div>
      <input type="checkbox" name="ads_reward_enabled" class="toggle toggle-primary js-setting-toggle" {{ if .s.AdsRewardEnabled }}checked{{ end }} />
    </label>

    <label class="form-control cursor-pointer">
      <div class="label">
        <span class="label-text">فعال بودن تبلیغ App Open</span>
      </div>
      <input type="checkbox" name="ads_app_open_enabled" class="toggle toggle-primary js-setting-toggle" {{ if .s.AdsAppOpenEnabled }}checked{{ end }} />
    </label>

      <label class="form-control cursor-pointer">
          <div class="label">
              <span class="label-text">نمایش اپدیت در برنامه </span>
          </div>
          <input type="checkbox" name="update_enable" class="toggle toggle-primary js-setting-toggle" {{ if .s.UpdateEnable }}checked{{ end }} />
      </label>
    <label class="form-control cursor-pointer">
      <div class="label">
        <span class="label-text">نمایش تبلیغات در صفحه اصلی</span>
      </div>
      <input type="checkbox" name="show_ads_on_main_page" class="toggle toggle-primary js-setting-toggle" {{ if .s.ShowAdsOnMainPage }}checked{{ end }} />
    </label>

    <label class="form-control">
      <div class="label"><span class="label-text">نسخه فعلی برنامه</span></div>
      <input class="input input-bordered" name="current_version" value="{{ .s.CurrentVersion }}" />
    </label>
    <label class="form-control">
      <div class="label"><span class="label-text">AD_UNIT_ID</span></div>
      <input class="input input-bordered" name="ad_unit_id" value="{{ .s.AdUnitID }}" />
    </label>
    <label class="form-control">
      <div class="label"><span class="label-text">ADS_REWARD_UNIT</span></div>
      <input class="input input-bordered" name="ads_reward_unit" value="{{ .s.AdsRewardUnit }}" />
    </label>
    <label class="form-control">
      <div class="label"><span class="label-text">درصد نمایش ریوارد (۰ تا ۱۰۰)</span></div>
      <input class="input input-bordered" type="number" min="0" max="100" name="reward_display_percent" value="{{ .s.RewardDisplayPercent }}" />
    </label>
    <label class="form-control">
      <div class="label"><span class="label-text">Ads_unit_Open</span></div>
      <input class="input input-bordered" name="ads_unit_open" value="{{ .s.AdsUnitOpen }}" />
    </label>
    <label class="form-control">
      <div class="label"><span class="label-text">AppTimer</span></div>
      <input class="input input-bordered" name="app_timer" value="{{ .s.AppTimer }}" />
    </label>
    <label class="form-control">
      <div class="label"><span class="label-text">New Domain</span></div>
      <input class="input input-bordered" name="app_domain" value="{{ .s.Domain }}" />
    </label>
    <label class="form-control">
      <div class="label"><span class="label-text">Ads_APPLICATION_ID</span></div>
      <input class="input input-bordered" name="ads_application_id" value="{{ .s.AdsApplicationID }}" />
    </label>
    <label class="form-control">
      <div class="label"><span class="label-text">Privacy URL</span></div>
      <input class="input input-bordered" name="privacy_url" value="{{ .s.PrivacyURL }}" placeholder="https://example.com/privacy" />
    </label>
    <label class="form-control">
      <div class="label"><span class="label-text">Connected Timeout (sec)</span></div>
      <input class="input input-bordered" name="connected_timeout" value="{{ .s.ConnectedTimeoutSeconds }}" />
    </label>
    <label class="form-control">
      <div class="label"><span class="label-text">تعداد کانفیگ برای Splash Conf</span></div>
      <input class="input input-bordered" type="number" min="2" name="splash_conf_count" value="{{ if gt .s.SplashConfCount 0 }}{{ .s.SplashConfCount }}{{ else }}4{{ end }}" />
    </label>
  </div>

  <div class="flex gap-2">
    <button class="btn btn-primary" type="submit">ذخیره تغییرات</button>
    <button class="btn btn-error" type="submit" formaction="/admin/settings/delete" formmethod="post" onclick="return confirm('تنظیمات حذف شود و به حالت پیش‌فرض برگردد؟')">حذف</button>
    <a class="btn" href="/">بازگشت</a>
  </div>
</form>

<div class="bg-base-100 rounded-box shadow p-3 mb-4">
  <h2 class="text-xl font-bold mb-2">بکاپ و بازیابی</h2>
  <p class="text-sm opacity-70 mb-3">خروجی گرفتن و وارد کردن بکاپ فقط به‌صورت ادغام انجام می‌شود و داده‌های فعلی حذف نمی‌شوند.</p>
  <div class="flex flex-wrap gap-2 items-center">
    <a class="btn btn-secondary" href="/admin/settings/export">Export</a>
    <form method="post" action="/admin/settings/import" enctype="multipart/form-data" class="flex flex-wrap gap-2 items-center" onsubmit="return confirm('بکاپ وارد شود و با داده‌های فعلی ادغام شود؟')">
      <input class="file-input file-input-bordered" type="file" name="backup_file" accept=".json,application/json" required />
      <button class="btn btn-primary" type="submit">Import</button>
    </form>
  </div>
</div>

<script>
  (function () {
    const toggleAll = document.getElementById("toggleAllSettings");
    if (!toggleAll) return;
    const toggles = Array.from(document.querySelectorAll(".js-setting-toggle"));
    if (toggles.length === 0) return;

    const syncMaster = () => {
      const checkedCount = toggles.filter((t) => t.checked).length;
      toggleAll.indeterminate = checkedCount > 0 && checkedCount < toggles.length;
      toggleAll.checked = checkedCount === toggles.length;
    };

    toggleAll.addEventListener("change", () => {
      toggles.forEach((t) => {
        t.checked = toggleAll.checked;
      });
      toggleAll.indeterminate = false;
    });

    toggles.forEach((t) => t.addEventListener("change", syncMaster));
    syncMaster();
  })();
</script>
