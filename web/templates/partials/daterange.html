<form method="get" class="card bg-base-100 shadow mb-4">
  <div class="card-body p-3">
    <div class="flex flex-wrap items-end gap-4">
      <div>
        <div class="label-text text-xs opacity-70 mb-1">از</div>
        <div class="flex gap-1">
          <select name="from_y" class="select select-bordered select-sm">
            {{ range .Years }}<option value="{{ . }}" {{ if eq $.FromY . }}selected{{ end }}>{{ . }}</option>{{ end }}
          </select>
          <select name="from_m" class="select select-bordered select-sm">
            {{ range .Months }}<option value="{{ .Value }}" {{ if eq $.FromM .Value }}selected{{ end }}>{{ .Label }}</option>{{ end }}
          </select>
          <select name="from_d" class="select select-bordered select-sm">
            {{ range .FromDays }}<option value="{{ . }}" {{ if eq $.FromD . }}selected{{ end }}>{{ . }}</option>{{ end }}
          </select>
        </div>
      </div>
      <div>
        <div class="label-text text-xs opacity-70 mb-1">تا</div>
        <div class="flex gap-1">
          <select name="to_y" class="select select-bordered select-sm">
            {{ range .Years }}<option value="{{ . }}" {{ if eq $.ToY . }}selected{{ end }}>{{ . }}</option>{{ end }}
          </select>
          <select name="to_m" class="select select-bordered select-sm">
            {{ range .Months }}<option value="{{ .Value }}" {{ if eq $.ToM .Value }}selected{{ end }}>{{ .Label }}</option>{{ end }}
          </select>
          <select name="to_d" class="select select-bordered select-sm">
            {{ range .ToDays }}<option value="{{ . }}" {{ if eq $.ToD . }}selected{{ end }}>{{ . }}</option>{{ end }}
          </select>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-sm">اعمال بازه</button>
    </div>
  </div>
</form>
