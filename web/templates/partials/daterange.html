<form method="get" class="card bg-base-100 shadow mb-4">
  <div class="card-body p-3">
    <div class="flex flex-wrap items-end gap-4">
      {{ template "partials/daterange_fields" . }}

      <div>
        <div class="label-text text-xs opacity-70 mb-1">بازه‌بندی نمودار</div>
        <select name="granularity" class="select select-bordered select-sm">
          {{ range .Granularities }}
          <option value="{{ .Value }}" {{ if eq $.Granularity .Value }}selected{{ end }}>{{ .Label }}</option>
          {{ end }}
        </select>
      </div>

      <label class="label cursor-pointer gap-2">
        <input type="checkbox" name="compare" value="1" class="checkbox checkbox-sm" {{ if .Compare }}checked{{ end }}>
        <span class="label-text text-xs">مقایسه با دورهٔ قبل</span>
      </label>

      <button type="submit" class="btn btn-primary btn-sm">اعمال بازه</button>
    </div>
  </div>
</form>
<script src="/static/js/calendar-picker.js"></script>
