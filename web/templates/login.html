<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود - VpnPannel</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-200 min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-sm shadow-xl bg-base-100">
    <div class="card-body">
      <div class="flex flex-col items-center gap-2 mb-2">
        <div class="bg-primary/10 text-primary rounded-full p-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <h1 class="text-xl font-bold">VpnPannel</h1>
        <p class="text-sm opacity-60">ورود به پنل مدیریت</p>
      </div>

      <form method="post" class="flex flex-col gap-3">
        {{ if .error }}
        <div class="alert alert-error text-sm py-2">{{ .error }}</div>
        {{ end }}

        <label class="form-control">
          <div class="label"><span class="label-text">ایمیل</span></div>
          <div class="relative">
            <span class="absolute inset-y-0 right-3 flex items-center text-base-content/40 pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </span>
            <input type="email" name="email" class="input input-bordered w-full pr-10" required autofocus />
          </div>
        </label>

        <label class="form-control">
          <div class="label"><span class="label-text">رمز عبور</span></div>
          <div class="relative">
            <span class="absolute inset-y-0 right-3 flex items-center text-base-content/40 pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input type="password" name="password" class="input input-bordered w-full pr-10" required />
          </div>
        </label>

        <label class="label cursor-pointer justify-start gap-2 -mt-1 py-0">
          <input type="checkbox" name="remember" class="checkbox checkbox-sm" />
          <span class="label-text">مرا به خاطر بسپار</span>
        </label>

        <button class="btn btn-primary w-full mt-1" type="submit">ورود</button>
      </form>
    </div>
  </div>
</body>
</html>
